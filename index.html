<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora científica · Órbita de Ideas</title><link rel="stylesheet" href="style.css"></head><body>
<main class="calculadora"><header><p>ÓRBITA DE IDEAS</p><h1>Calculadora científica</h1><p>Operaciones claras para seguir practicando.</p></header>
<section class="panel" aria-labelledby="titulo-calculo"><h2 id="titulo-calculo">Ingresá los operandos</h2><div class="campos"><label for="operando-a">Operando A<input id="operando-a" type="number" inputmode="decimal" step="any"></label><label for="operando-b">Operando B<input id="operando-b" type="number" inputmode="decimal" step="any"><small>La raíz usa solamente A.</small></label></div>
<div class="operaciones" aria-label="Operaciones"><button type="button" id="sumar" data-operation="add">Sumar</button><button type="button" id="restar" data-operation="subtract">Restar</button><button type="button" id="multiplicar" data-operation="multiply">Multiplicar</button><button type="button" id="dividir" data-operation="divide">Dividir</button><button type="button" id="potencia" data-operation="power">Potencia</button><button type="button" id="raiz" data-operation="sqrt">Raíz de A</button></div>
<div class="salida"><p class="salida-etiqueta">Resultado</p><output id="resultado" aria-live="polite">—</output><p id="mensaje" role="alert"></p></div><button type="button" id="limpiar" class="secundario">Limpiar</button></section></main><script src="script.js"></script></body></html>
